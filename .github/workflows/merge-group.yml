# Jobs that run on merge_group, meaning they must pass before changes land. They also run on pull_request.

on:
    pull_request:
    merge_group:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    pre-commit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
              with:
                  cache: true
              env:
                  GITHUB_TOKEN: ${{ github.token }}
            - run: just install
            - run: pre-commit run --all-files

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
              with:
                  cache: true
              env:
                  GITHUB_TOKEN: ${{ github.token }}
            - run: just lint

    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
              with:
                  cache: true
              env:
                  GITHUB_TOKEN: ${{ github.token }}
            - run: just format

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
              with:
                  cache: true
              env:
                  GITHUB_TOKEN: ${{ github.token }}
            # The bats suite runs `claude plugin validate`, which needs the claude CLI.
            - run: npm install --global @anthropic-ai/claude-code
            - run: just test

    all-checks:
        name: All checks
        if: ${{ !cancelled() }}
        needs: [pre-commit, lint, format, test]
        runs-on: ubuntu-latest
        steps:
            - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
              with:
                  jobs: ${{ toJSON(needs) }}
