<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>{{TITLE}}</title>
		<style>
			:root{color-scheme:dark;--bg:#101318;--panel:#171d25;--ink:#e5eaf1;--muted:#a9b6c8;--rule:#354152;--accent:#e6c273;--header:64px;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
			*{box-sizing:border-box}body{margin:0}a{color:#9ad9d6}button,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--rule);border-radius:5px;padding:6px 10px}button,select,summary{cursor:pointer}button:disabled{opacity:.35}a,button,select{touch-action:manipulation}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
			.topbar{position:sticky;top:0;z-index:10;min-height:var(--header);padding:10px 22px;background:#101318f5;border-bottom:1px solid var(--rule);display:flex;gap:16px;align-items:center}.topbar h1{font-size:17px;margin:0;flex:1;min-width:0}.navigation{display:flex;gap:8px;align-items:center}.navigation select{max-width:32vw}.skip{position:absolute;top:-100px}.skip:focus{top:0;z-index:20;background:var(--bg)}
			.section{display:grid;grid-template-columns:minmax(0,34%) minmax(0,1fr);gap:40px;padding:32px max(24px,calc((100vw - 1500px)/2));align-items:start}.explanations{min-width:0}h2{font-size:23px;margin:0 0 26px}h3{font-size:24px;line-height:1.25;margin:12px 0 20px}.step{scroll-margin-top:calc(var(--reading-line,35vh) - 2px);min-height:70vh;padding:16px 0 100px;overflow-wrap:anywhere}.step:last-child{min-height:80vh}.location{font:13px/1.5 ui-monospace,monospace;color:var(--muted)}.step code{font-size:.9em;color:#d8c7ff}.warning{border-left:3px solid var(--accent);padding-left:12px;color:var(--accent)}
			.code-panel{position:sticky;top:calc(var(--header) + 18px);height:calc(100vh - var(--header) - 40px);min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--rule);border-radius:8px;overflow:hidden}.code-panel header{padding:12px 16px;border-bottom:1px solid var(--rule);font-size:13px}.code-panel strong{display:block;overflow-wrap:anywhere;font-family:ui-monospace,monospace}.code-panel header span{color:var(--muted)}.code-panel output{display:block;color:var(--accent)}.code-panel footer{padding:8px 12px;border-top:1px solid var(--rule);text-align:right}.follow{font-size:12px}.source{position:relative;flex:1;min-height:0;overflow:auto;margin:0;padding:12px 0;font:13px/1.75 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:4}.line{position:relative;display:block;white-space:pre-wrap;overflow-wrap:anywhere;padding:0 16px 0 4.5em;min-height:1.75em;border-left:3px solid transparent}.number{position:absolute;left:0;top:0;width:3.5em;padding-right:.75em;text-align:right;color:#98a6b8;font-variant-numeric:tabular-nums;user-select:none;white-space:nowrap}.line.highlight{background:#51452366;border-left-color:var(--accent)}.line.highlight .number{color:var(--accent)}.js .step{opacity:.65}.js .step.is-active{opacity:1}.experiment{padding:24px;max-width:1300px;margin:auto}.status{padding:24px;color:var(--muted);font-size:13px}noscript p{padding:16px}
			{{SYNTAX}}
			.source{background:var(--panel);color:var(--ink);white-space:normal}.source>code{color:inherit}
			@media(max-width:700px){:root{--header:66px}.topbar{padding:8px 12px;gap:10px}.topbar h1{font-size:13px;line-height:1.25}.navigation{gap:4px}.navigation select{font-size:12px;width:32vw}.navigation button{padding:5px 8px}.section{display:flex;flex-direction:column;gap:0;padding:18px 14px}.code-panel{order:-1;width:100%;top:calc(var(--header) + 6px);height:42vh;height:42svh;margin-bottom:24px;z-index:3;box-shadow:0 10px 15px var(--bg)}.code-panel header{padding:7px 10px;font-size:11px}.code-panel footer{padding:3px 8px}.source{font-size:12px}.line{padding-left:3.75em;padding-right:10px}.number{width:3em}.step{min-height:75vh;padding-bottom:80px}.explanations{width:100%}}
			@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
			@media print{.topbar,.code-panel footer{display:none}.section{display:block;break-before:page}.code-panel{position:static;height:auto;overflow:visible}.source{overflow:visible}.step{min-height:0!important;opacity:1!important;padding:8px 0}.experiment{break-inside:avoid}}
		</style>
	</head>
	<body>
		<a class="skip" href="#content">Skip to walkthrough</a>
		<header class="topbar">
			<h1>{{TITLE}}</h1>
			<nav class="navigation" aria-label="Walkthrough">
				<select id="steps" aria-label="Explanation">
					{{OPTIONS}}</select
				><button id="previous" aria-label="Previous explanation">←</button
				><button id="next" aria-label="Next explanation">→</button>
			</nav>
		</header>
		<noscript
			><p>
				Complete files and explanations are readable below. Enable JavaScript for synchronized highlights.
			</p></noscript
		>
		<main id="content">{{SECTIONS}}</main>
		<footer class="status">{{STATUS}}</footer>
		<script>
			'use strict';
			document.documentElement.classList.add('js');
			const steps = Array.from(document.querySelectorAll('.step'));
			const select = document.getElementById('steps');
			const previous = document.getElementById('previous');
			const next = document.getElementById('next');
			const reduced = matchMedia('(prefers-reduced-motion: reduce)');
			let active = null;
			let navigating = false;
			let navigationTimer;
			function threshold() {
				const header = document.querySelector('.topbar').getBoundingClientRect().height;
				document.documentElement.style.setProperty('--header', `${header}px`);
				const panel = document.querySelector('.code-panel');
				const line =
					innerWidth > 700
						? Math.max(header + 20, innerHeight * 0.35)
						: Math.min(innerHeight - 35, header + panel.getBoundingClientRect().height + 30);
				document.documentElement.style.setProperty('--reading-line', `${line}px`);
				return line;
			}
			function focusCode(step) {
				const panel = step.closest('.section').querySelector('.code-panel');
				const first = Number(step.dataset.first),
					last = Number(step.dataset.last);
				const rows = Array.from(panel.querySelectorAll('.line'));
				for (const row of rows)
					row.classList.toggle(
						'highlight',
						Number(row.dataset.line) >= first && Number(row.dataset.line) <= last,
					);
				panel.querySelector('output').textContent = `Lines ${first}–${last}`;
				if (panel.dataset.follow === 'off') return;
				const pre = panel.querySelector('pre'),
					start = rows[first - 1],
					end = rows[last - 1];
				pre.scrollTop = Math.max(
					0,
					start.offsetTop -
						Math.max(8, (pre.clientHeight - (end.offsetTop + end.offsetHeight - start.offsetTop)) / 2),
				);
			}
			function activate(step) {
				if (active !== step) {
					active?.classList.remove('is-active');
					active = step;
					active.classList.add('is-active');
				}
				select.value = step.id;
				const index = steps.indexOf(step);
				previous.disabled = index === 0;
				next.disabled = index === steps.length - 1;
				focusCode(step);
			}
			function update() {
				if (navigating) return;
				const limit = threshold();
				let candidate = steps[0];
				for (const step of steps) {
					if (step.getBoundingClientRect().top <= limit) candidate = step;
					else break;
				}
				if (candidate !== active) activate(candidate);
			}
			function goTo(step, push = true, behavior = 'smooth') {
				navigating = true;
				clearTimeout(navigationTimer);
				activate(step);
				if (push) history.pushState(null, '', `#${step.id}`);
				window.scrollTo({
					top: scrollY + step.getBoundingClientRect().top - threshold() + 2,
					behavior: reduced.matches ? 'instant' : behavior,
				});
				navigationTimer = setTimeout(() => {
					navigating = false;
				}, 600);
			}
			let scheduled = false;
			window.addEventListener(
				'scroll',
				() => {
					if (!scheduled) {
						scheduled = true;
						requestAnimationFrame(() => {
							scheduled = false;
							update();
						});
					}
				},
				{passive: true},
			);
			window.addEventListener('resize', () => {
				threshold();
				if (active) goTo(active, false, 'instant');
			});
			for (const event of ['wheel', 'touchstart'])
				window.addEventListener(
					event,
					() => {
						navigating = false;
						clearTimeout(navigationTimer);
					},
					{passive: true},
				);
			select.addEventListener('change', () => goTo(document.getElementById(select.value)));
			previous.addEventListener('click', () => goTo(steps[Math.max(0, steps.indexOf(active) - 1)]));
			next.addEventListener('click', () => goTo(steps[Math.min(steps.length - 1, steps.indexOf(active) + 1)]));
			for (const section of document.querySelectorAll('.section')) {
				focusCode(section.querySelector('.step'));
				const panel = section.querySelector('.code-panel'),
					button = panel.querySelector('.follow');
				button.addEventListener('click', () => {
					const enabled = panel.dataset.follow === 'off';
					panel.dataset.follow = enabled ? 'on' : 'off';
					button.setAttribute('aria-pressed', String(enabled));
					button.textContent = `Follow highlights: ${enabled ? 'on' : 'off'}`;
					if (enabled) focusCode(section.querySelector('.is-active') || section.querySelector('.step'));
				});
			}
			document.addEventListener('click', (event) => {
				const link = event.target.closest('.location a');
				if (link) {
					event.preventDefault();
					goTo(document.getElementById(link.hash.slice(1)));
				}
			});
			function fromHash() {
				const target = document.getElementById(location.hash.slice(1));
				if (target?.classList.contains('step')) goTo(target, false, 'instant');
				else update();
			}
			window.addEventListener('popstate', fromHash);
			threshold();
			activate(steps[0]);
			fromHash();
		</script>
	</body>
</html>
